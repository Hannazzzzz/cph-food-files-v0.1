name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
      # GitHub Pages answers unknown paths with 404.html and an HTTP 404 status, even
      # though the app renders. 404.html stays as the fallback for genuinely unknown
      # paths. Real routes get their own index.html so they return a proper 200.
      - name: SPA fallback and real routes
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/about
          cp dist/index.html dist/about/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
